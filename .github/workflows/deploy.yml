name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check bunny.net settings
        env:
          ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          PULLZONE_ID: ${{ vars.BUNNY_PULLZONE_ID }}
          HAS_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD != '' }}
          HAS_API_KEY: ${{ secrets.BUNNY_API_KEY != '' }}
        run: |
          missing=""
          [ -n "$ZONE" ] || missing="$missing\n- Variable BUNNY_STORAGE_ZONE"
          [ -n "$PULLZONE_ID" ] || missing="$missing\n- Variable BUNNY_PULLZONE_ID"
          [ "$HAS_STORAGE_PASSWORD" = "true" ] || missing="$missing\n- Secret BUNNY_STORAGE_PASSWORD"
          [ "$HAS_API_KEY" = "true" ] || missing="$missing\n- Secret BUNNY_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing bunny.net settings. Add them under Settings > Secrets and variables > Actions, as repository (not environment) variables and secrets:"
            printf "$missing\n"
            exit 1
          fi
          echo "All bunny.net settings present."
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Upload to bunny.net storage
        env:
          ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST || 'storage.bunnycdn.com' }}
          STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          cd dist
          find . -type f | sed 's|^\./||' | while read -r file; do
            curl --fail --silent --show-error --retry 3 \
              -X PUT "https://${STORAGE_HOST}/${ZONE}/${file}" \
              -H "AccessKey: ${STORAGE_PASSWORD}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" > /dev/null
            echo "uploaded ${file}"
          done
      - name: Purge CDN cache
        env:
          PULLZONE_ID: ${{ vars.BUNNY_PULLZONE_ID }}
          API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.bunny.net/pullzone/${PULLZONE_ID}/purgeCache" \
            -H "AccessKey: ${API_KEY}" -H "Content-Length: 0"
