# Sveltia CMS: a git-based editor. Content is saved as Markdown commits in this repository.
# Sign in at /admin/ with a GitHub personal access token that has write access to the repo.
backend:
  name: github
  repo: wardweistra/phoenix-eccdm-website
  branch: main

site_url: https://cancermodel.eu
media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Summary, widget: text, hint: One or two sentences shown in listings and search results. }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: author, label: Author, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: Drafts are not published. }
      - { name: body, label: Body, widget: markdown }
